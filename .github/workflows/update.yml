name: Actualitza EPG XML

on:
  schedule:
    # Freqüència d'execució (cada 5 minuts)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permet l'execució manual si es necessita

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executar script d'actualització EPG
        run: python update_epg.py

      - name: Fer commit i push dels canvis
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git commit -m "Auto-update epg.xml" || exit 0
          git push
